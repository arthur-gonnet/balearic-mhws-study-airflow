name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Same system libraries the Dockerfile installs before pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libproj-dev proj-data proj-bin libgeos-dev gcc g++

      - name: Install package
        run: pip install -e . pytest

      # test_dags.py needs apache-airflow, only installed in the Docker image
      - name: Run tests
        run: python -m pytest tests/
