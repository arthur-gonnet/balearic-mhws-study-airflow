# Minimal single-node Slurm config for local testing of the Airflow -> SSH -> sbatch bridge.
# NODE_HOSTNAME is substituted at container startup (see entrypoint.sh) with the container's
# actual hostname, since that's not known until runtime.

ClusterName=testcluster
SlurmctldHost=NODE_HOSTNAME

MpiDefault=none
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
ReturnToService=2

# The declared CPUs/RealMemory below are bookkeeping to satisfy job resource requests, not real
# hardware capacity (see note above NodeName) - tell slurmd to trust them instead of refusing to
# start when they don't match what it actually detects on the host.
SlurmdParameters=config_overrides

SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid
SlurmdSpoolDir=/var/spool/slurmd
SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core

SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log

# CPUs/RealMemory declared here are just what's needed to satisfy compute_mhws.sbatch's resource
# request in Slurm's admission check - with TaskPlugin=task/none (no cgroups) nothing actually
# enforces or reserves them, so this is bookkeeping for a synthetic single-node test rig, not a
# real capacity guarantee.
NodeName=NODE_HOSTNAME CPUs=8 RealMemory=40000 State=UNKNOWN
PartitionName=debug Nodes=NODE_HOSTNAME Default=YES MaxTime=INFINITE State=UP
